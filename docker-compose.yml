services:
  homelab-tsdb:
  image: ghcr.io/bramvh98/homelab-tsdb:latest
  container_name: homelab-tsdb
  restart: unless-stopped
  ports:
    - "8080:8080"
    - "5514:5514/udp"
  volumes:
    - homelab-tsdb-data:/data
  command:
    - "-data=/data"
    - "-addr=:8080"
    - "-syslog-addr=:5514"
    - "-syslog-allow=172.16.0.0/12"

volumes:
  homelab-tsdb-data: